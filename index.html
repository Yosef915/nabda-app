
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100e20">
  <title>نبضة | Nabda</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #30234c, #100e20 65%);
      color: #fff;
      font-family: system-ui, sans-serif;
    }

    main {
      width: 100%;
      max-width: 390px;
      text-align: center;
    }

    .logo { font-size: 42px; margin-bottom: 4px; }

    h1 {
      font-size: 34px;
      margin: 0;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #c7bddc;
      margin: 12px 0 28px;
      line-height: 1.8;
    }

    .pulse-button {
      width: 190px;
      height: 190px;
      border: 1px solid #d8aaff;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #edb8ff, #a34bdf 55%, #6426a8);
      box-shadow: 0 0 35px #b45be966, 0 0 90px #883fd933;
      color: white;
      font-size: 60px;
      cursor: pointer;
      transition: transform .2s;
      touch-action: manipulation;
    }

    .pulse-button:active { transform: scale(.92); }

    .pulse-button:disabled {
      opacity: .5;
      cursor: wait;
    }

    .pulse-button.pulsing {
      animation: pulse .65s ease-out;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 #e7b2ff99; }
      100% { box-shadow: 0 0 0 35px #e7b2ff00; }
    }

    .panel {
      margin-top: 30px;
      padding: 18px;
      border: 1px solid #ffffff20;
      border-radius: 20px;
      background: #ffffff09;
      text-align: right;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      color: #e2d5f3;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #ffffff30;
      border-radius: 12px;
      background: #171326;
      color: white;
      font: inherit;
      direction: ltr;
    }

    .connect {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 12px;
      background: #c28bea;
      color: #1b1027;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    .connect:disabled { opacity: .6; }

    #status {
      margin-top: 18px;
      font-size: 14px;
      color: #e4d3fa;
      line-height: 1.8;
      overflow-wrap: anywhere;
      min-height: 50px;
    }

    .hint {
      font-size: 12px;
      color: #b7a9cc;
      line-height: 1.8;
    }
  </style>
</head>

<body>
  <main>
    <div class="logo">♡</div>
    <h1>نبضة</h1>

    <p class="subtitle">
      أحيانًا تكفي إشارة صغيرة<br>
      لتقول: أنا أتذكرك.
    </p>

    <button id="pulse" class="pulse-button"
      aria-label="إرسال نبضة" disabled>♡</button>

    <div class="panel">
      <label for="room">رمز الربط المشترك بين الهاتفين</label>

      <input id="room" maxlength="40"
        placeholder="مثال: nabda-4827"
        autocomplete="off">

      <button id="connect" class="connect">
        الاتصال بنبضة
      </button>

      <p class="hint">
        استخدما الرمز نفسه على الهاتفين.
        لا تستخدما معلومات شخصية.
      </p>
    </div>

    <div id="status" role="status" aria-live="polite">
      التطبيق جاهز. أدخلي رمز الربط ثم اضغطي الاتصال.
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    "use strict";

    // رابط مشروع Supabase الحالي
    const SUPABASE_URL =
      "https://zdnadoknsevufafyfuid.supabase.co";

    // ضعي هنا المفتاح العام نفسه الموجود في ملفك الحالي
    const SUPABASE_KEY =
      "PASTE_YOUR_EXISTING_PUBLISHABLE_KEY_HERE";

    const statusBox = document.getElementById("status");
    const pulseButton = document.getElementById("pulse");
    const connectButton = document.getElementById("connect");
    const roomInput = document.getElementById("room");

    let supabaseClient = null;
    let channel = null;
    let ready = false;
    let busy = false;
    let connectionAttempt = 0;

    function showStatus(message) {
      statusBox.textContent = message;
    }

    function animatePulse() {
      pulseButton.classList.remove("pulsing");
      void pulseButton.offsetWidth;
      pulseButton.classList.add("pulsing");

      setTimeout(() => {
        pulseButton.classList.remove("pulsing");
      }, 700);
    }

    function setDisconnected() {
      ready = false;
      pulseButton.disabled = true;
    }

    async function disconnectChannel() {
      setDisconnected();

      if (channel && supabaseClient) {
        const oldChannel = channel;
        channel = null;
        await supabaseClient.removeChannel(oldChannel);
      }
    }

    connectButton.addEventListener("click", async () => {
      // إظهار استجابة فورية لاختبار الزر
      showStatus("تم الضغط على الاتصال. جارٍ فحص الإعدادات...");
      connectButton.disabled = true;

      const attempt = ++connectionAttempt;
      const room = roomInput.value.trim();

      try {
        setDisconnected();

        if (!/^[-a-zA-Z0-9_]{4,40}$/.test(room)) {
          showStatus("أدخلي رمزًا من 4 إلى 40 حرفًا أو رقمًا أو شرطة.");
          return;
        }

        if (
          !SUPABASE_KEY ||
          SUPABASE_KEY === "PASTE_YOUR_EXISTING_PUBLISHABLE_KEY_HERE"
        ) {
          showStatus("لم تضعي المفتاح العام الحالي في الكود.");
          return;
        }

        if (!window.supabase ||
            typeof window.supabase.createClient !== "function") {
          showStatus(
            "تعذر تحميل مكتبة الاتصال. تحققي من الإنترنت أو حاولي مجددًا."
          );
          return;
        }

        if (!supabaseClient) {
          supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
          );
        }

        await disconnectChannel();

        if (attempt !== connectionAttempt) return;

        showStatus("تم فحص الإعدادات. جارٍ الاتصال بالقناة المشتركة...");

        const newChannel = supabaseClient.channel("nabda-" + room, {
          config: {
            broadcast: { self: false }
          }
        });

        channel = newChannel;

        newChannel.on(
          "broadcast",
          { event: "pulse" },
          ({ payload }) => {
            if (channel !== newChannel) return;
            if (!payload || !payload.sentAt) return;

            animatePulse();

            if ("vibrate" in navigator) {
              navigator.vibrate([120, 60, 120]);
            }

            showStatus("وصلتك نبضة ❤️");
          }
        );

        newChannel.subscribe((state, err) => {
          if (channel !== newChannel ||
              attempt !== connectionAttempt) return;

          if (state === "SUBSCRIBED") {
            ready = true;
            pulseButton.disabled = false;
            connectButton.disabled = false;

            showStatus(
              "أنت متصل بنجاح! افتحي التطبيق على الهاتف الآخر واستخدمي الرمز نفسه."
            );
          } else if (
            state === "CHANNEL_ERROR" ||
            state === "TIMED_OUT"
          ) {
            setDisconnected();
            connectButton.disabled = false;

            showStatus(
              "فشل الاتصال بالقناة. " +
              (err && err.message ? err.message : "تحققي من إعدادات Realtime والإنترنت.")
            );
          } else if (state === "CLOSED") {
            setDisconnected();
            connectButton.disabled = false;
            showStatus("أُغلق الاتصال. اضغطي الاتصال بنبضة للمحاولة مجددًا.");
          }
        });

      } catch (error) {
        if (attempt === connectionAttempt) {
          setDisconnected();
          connectButton.disabled = false;
          showStatus(
            "حدث خطأ أثناء الاتصال: " +
            (error && error.message ? error.message : "خطأ غير معروف")
          );
        }
      } finally {
        if (attempt === connectionAttempt) {
          connectButton.disabled = false;
        }
      }
    });

    pulseButton.addEventListener("click", async () => {
      if (!ready || !channel || busy) return;

      const activeChannel = channel;
      busy = true;
      pulseButton.disabled = true;

      showStatus("جارٍ إرسال النبضة...");

      try {
        const result = await activeChannel.send({
          type: "broadcast",
          event: "pulse",
          payload: { sentAt: Date.now() }
        });

        if (channel !== activeChannel) return;

        if (result === "ok") {
          animatePulse();
          showStatus("أُرسلت النبضة ❤️");
        } else {
          showStatus(
            "لم يؤكد الخادم الإرسال. النتيجة: " + String(result)
          );
        }
      } catch (error) {
        showStatus(
          "تعذر إرسال النبضة: " +
          (error && error.message ? error.message : "خطأ غير معروف")
        );
      } finally {
        busy = false;
        pulseButton.disabled = !ready;
      }
    });

    // إظهار أخطاء JavaScript التي قد تمنع عمل التطبيق
    window.addEventListener("error", (event) => {
      if (event.message) {
        showStatus("خطأ في تشغيل التطبيق: " + event.message);
      }
    });

    // التحقق من أن المتصفح حمّل المكتبة
    if (window.supabase &&
        typeof window.supabase.createClient === "function") {
      showStatus("التطبيق جاهز. أدخلي رمز الربط ثم اضغطي الاتصال.");
    } else {
      showStatus(
        "الصفحة تعمل، لكن مكتبة الاتصال لم تُحمّل بعد. تحققي من الإنترنت."
      );
    }
  </script>
</body>
</html>
